<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaishi Japanese image diagnostics</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#eef2ff;color:#172033}main{max-width:1100px;margin:auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
article{background:white;padding:10px;border-radius:14px;box-shadow:0 4px 16px #17255418}img{display:block;width:100%;aspect-ratio:9/5;object-fit:contain;border-radius:10px;background:#f8fafc}
code{display:block;font-size:.68rem;overflow-wrap:anywhere;margin-top:5px}.ok{color:#166534}.bad{color:#991b1b}
.back-to-app{display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;border:2px solid #bfdbfe;border-radius:999px;background:#2563eb;color:#fff;box-shadow:0 4px 12px #0f172a35;font-weight:800;line-height:1;text-decoration:none;white-space:nowrap}
.back-to-app:hover{background:#1d4ed8}.back-to-app:focus-visible{outline:3px solid #fbbf24;outline-offset:3px}
</style>
</head>
<body><main>
<header><div><h1>Image diagnostics</h1><p id="summary">Loading mappings…</p></div><a class="back-to-app" href="./">← Back to app</a></header>
<p id="status">Checking images…</p><div class="grid" id="grid"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
Promise.all([fetch('memory-scenes.json',{cache:'no-store'}).then(r=>r.json()),fetch('data/katakana-core-10k.json',{cache:'no-store'}).then(r=>r.json())]).then(([scenes,katakana])=>{
 const legacyRows=Object.entries(scenes).map(([key,value])=>{const [word,reading]=key.split('|');return {word,reading,file:value.file,alt:value.alt||`Mnemonic scene for ${word}`,source:'Kaishi mnemonic'};});
 const katakanaRows=(katakana.records||[]).filter(record=>record.picture).map(record=>({word:record.word,reading:record.reading,file:`media/${record.picture}`,alt:`Katakana mnemonic scene for ${record.word}`,source:'Katakana Core'}));
 const rows=[...legacyRows,...katakanaRows],unique=new Set(rows.map(row=>row.file));
 document.querySelector('#summary').textContent=`${rows.length} mappings · ${legacyRows.length} Kaishi · ${katakanaRows.length} Katakana Core · ${unique.size} unique images`;
 document.querySelector('#grid').innerHTML=rows.map(row=>`<article><img src="${esc(row.file)}" alt="${esc(row.alt)}"><div><b>${esc(row.word)}</b>（${esc(row.reading)}）</div><small>${esc(row.source)}</small><code>${esc(row.file)}</code></article>`).join('');
 const images=[...document.images];
 return Promise.all(images.map(img=>new Promise(resolve=>{if(img.complete)resolve(img.naturalWidth>0);else{img.onload=()=>resolve(true);img.onerror=()=>resolve(false)}}))).then(results=>{
  const failed=results.filter(x=>!x).length,el=document.querySelector('#status');
  el.textContent=failed?`${failed} image(s) failed to load`:`All ${results.length} mapped images loaded successfully`;el.className=failed?'bad':'ok';
 });
}).catch(err=>{const el=document.querySelector('#status');el.textContent=`Diagnostics failed: ${err.message}`;el.className='bad'});
</script>
</main></body></html>
