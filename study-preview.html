<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study View Preview</title><link rel="stylesheet" href="styles.css?v=4.0.1"><link rel="stylesheet" href="vms.css?v=v4.5 Best Match"><style>body{background:#071226;color:#fff}main{max-width:760px;margin:auto;padding:18px}.preview-shell{background:#0c1830;border-radius:18px;padding:18px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:14px;font-size:.75rem;text-align:center}.steps span{opacity:.55}.steps span:first-child{opacity:1;font-weight:800}.note{font-size:.85rem;opacity:.75}</style></head><body><main><div class="topbar"><a href="javascript:window.close()">← Close</a><b>True Study View Preview</b><span>Gold Pack</span></div><div class="preview-shell"><p class="note">This uses the same image, overlay settings, reveal order and card renderer as the learner-facing app.</p><div id="preview"></div><div class="steps"><span>1 Picture</span><span>2 Kanji</span><span>3 Reading</span><span>4 Story</span><span>5 Audio</span></div></div></main><script src="vms.js?v=v4.5 Best Match"></script><script>(async()=>{const key=new URLSearchParams(location.search).get('key');const source=await fetch('visual-mnemonics.json?v=v4.5 Best Match').then(r=>r.json());const drafts=JSON.parse(localStorage.getItem('kq-vms-drafts-v43')||'{}');const cards={...source,...drafts};const v=cards[key],mount=document.getElementById('preview');if(!v){mount.textContent='Card not found.';return}mount.innerHTML=window.KaishiVMS.render(v,true);window.KaishiVMS.wire(mount.querySelector('.vms-card'))})()</script></body></html>
