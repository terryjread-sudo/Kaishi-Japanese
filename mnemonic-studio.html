<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaishi Quest Mnemonic Studio</title><link rel="stylesheet" href="styles.css?v=4.0.1"><link rel="stylesheet" href="vms.css?v=4.1.0"><style>main{max-width:980px;margin:auto;padding:18px}.studio-grid{display:grid;grid-template-columns:300px 1fr;gap:18px}.studio-list{max-height:75vh;overflow:auto}.studio-list button{width:100%;margin:4px 0;text-align:left}.editor{display:grid;gap:10px}.editor textarea{min-height:110px}.preview{margin-top:18px}@media(max-width:760px){.studio-grid{grid-template-columns:1fr}.studio-list{max-height:260px}}</style></head><body><header><div><small>Kaishi Quest</small><h1>Mnemonic Studio</h1></div><a href="index.html">← App</a></header><main><p>Edit draft mnemonic text locally, preview the progressive card, then export an updated JSON file.</p><div class="studio-grid"><section><input id="search" placeholder="Search word, reading or meaning"><div id="list" class="studio-list"></div></section><section class="editor"><label>Word<input id="word" readonly></label><label>Reading<input id="reading" readonly></label><label>Meaning<input id="meaning"></label><label>Sounds like<input id="sound"></label><label>Story<textarea id="story"></textarea></label><label>Overlay opacity<input id="opacity" type="range" min="0.1" max="0.8" step="0.05"></label><button id="save" class="primary">Save local draft</button><button id="export">Export visual-mnemonics.json</button><div id="preview" class="preview"></div></section></div></main><script src="mnemonic-studio.js?v=4.1.0"></script></body></html>
