<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaishi Quest Mnemonic Studio</title><link rel="stylesheet" href="styles.css?v=4.0.1"><link rel="stylesheet" href="vms.css?v=4.2.0"><style>
main{max-width:1000px;margin:auto;padding:18px}.studio-grid{display:grid;grid-template-columns:310px 1fr;gap:18px}.studio-list{max-height:72vh;overflow:auto}.studio-list button{width:100%;margin:4px 0;text-align:left}.editor{display:grid;gap:10px}.editor textarea{min-height:110px}.preview{margin-top:18px}.review-bar{display:grid;grid-template-columns:1fr 1fr;gap:10px}.approve{background:#15803d;color:#fff}.regenerate{background:#b91c1c;color:#fff}.status{padding:10px 12px;border-radius:12px;font-weight:800}.status-approved{background:#dcfce7;color:#166534}.status-needs-regeneration{background:#fee2e2;color:#991b1b}.status-pending-review{background:#fef3c7;color:#92400e}.queue-summary{display:flex;gap:8px;flex-wrap:wrap}.queue-summary span{padding:6px 10px;border-radius:999px;background:#eef2ff}.studio-item-status{display:block;font-size:.75rem;margin-top:3px}@media(max-width:760px){.studio-grid{grid-template-columns:1fr}.studio-list{max-height:260px}.review-bar{grid-template-columns:1fr}}</style></head><body>
<header><div><small>Kaishi Quest development tool</small><h1>Mnemonic Studio</h1></div><a href="index.html">← App</a></header>
<main>
<p>Review each card, edit its text and either approve the image for the main app or flag it for AI regeneration. Changes are stored on this device until you export and upload <code>visual-mnemonics.json</code>.</p>
<div id="summary" class="queue-summary"></div>
<div class="studio-grid">
<section><input id="search" placeholder="Search word, reading or meaning"><select id="filter"><option value="all">All statuses</option><option value="approved">Approved</option><option value="needs-regeneration">Needs regeneration</option><option value="pending-review">Pending review</option></select><div id="list" class="studio-list"></div></section>
<section class="editor">
<div id="status" class="status">No card selected</div>
<label>Word<input id="word" readonly></label><label>Reading<input id="reading" readonly></label><label>Meaning<input id="meaning"></label><label>Sounds like<input id="sound"></label><label>Story<textarea id="story"></textarea></label><label>Regeneration note<textarea id="note" placeholder="Explain what should change in the next image"></textarea></label><label>Overlay opacity<input id="opacity" type="range" min="0.1" max="0.8" step="0.05"></label>
<div class="review-bar"><button id="approve" class="approve">✓ Approve image for app</button><button id="regenerate" class="regenerate">↻ Flag for regeneration</button></div>
<button id="save" class="primary">Save local draft</button><button id="export">Export visual-mnemonics.json</button><button id="exportQueue">Export regeneration queue only</button>
<div id="preview" class="preview"></div>
</section></div></main><script src="mnemonic-studio.js?v=4.2.0"></script></body></html>
